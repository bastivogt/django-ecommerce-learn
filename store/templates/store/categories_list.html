{% extends "base.html" %} 
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %} 
    <div class="container py-5">
        <h1>{{ title }}</h1>
        {% if categories_all %}
            <ul>
                {% for category in categories_all %}
                    <li><a href="{{ category.get_absolute_url }}">{{ category.name }}</a></li>
                {% endfor %}
            </ul>
        {% endif %} 
    </div>


{% endblock %}
